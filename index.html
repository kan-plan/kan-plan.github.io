<style>
:root {
  /* 다크 터미널 하나로 고정. 의미 색: 숏=코랄, 익절·매수 대기=민트, 현물=골드, 선물=페리윙클, 바닥=로즈, 현재가=흰 글로우
     레이아웃: 머리 → 종목 탭 → (지금 할 일 카드 → 가격 지도 → 레벨 표) → 원칙 → 기록 */
  --bg: #0e1626;
  --bg2: #0b111e;
  --panel: #152036;
  --line: #26344f;
  --text: #e9eef7;
  --muted: #8d9ab3;
  --short: #ff6b5e;
  --take: #3dd9a8;
  --spot: #f5b841;
  --fut: #8c9eff;
  --bottom: #ff4f7b;
  --ref: #6f7d99;
  --display: "Chakra Petch", "IBM Plex Sans KR", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: radial-gradient(1200px 600px at 80% -10%, #18264a 0%, transparent 60%), var(--bg); background-color: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; min-height: 100%; }
.wrap { max-width: 960px; margin: 0 auto; padding: 26px 16px 56px; display: grid; gap: 24px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--spot); outline-offset: 2px; }

header { display: grid; gap: 6px; }
header h1 { font-size: clamp(34px, 7vw, 52px); font-weight: 700; line-height: 1; }
header h1 b { color: var(--spot); }
.updated { color: var(--muted); font-size: 14px; }
.updated .num { color: var(--text); }

/* 탭 */
.tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; padding: 8px 0; background: linear-gradient(var(--bg) 70%, transparent); overflow-x: auto; }
.tab { font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tab .px { font-weight: 500; font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--take); margin-right: 5px; vertical-align: 1px; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.tab[aria-selected="true"] { color: var(--bg); background: var(--text); border-color: var(--text); }
.tab[aria-selected="true"] .px { color: #3a4560; }

/* 카드 */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; align-content: start; }
.card h3 { font-size: 14px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { font-family: var(--body); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.c-short { color: var(--short); } .c-take { color: var(--take); } .c-spot { color: var(--spot); } .c-fut { color: var(--fut); } .c-bottom { color: var(--bottom); } .c-ref { color: var(--ref); }
.big { font-size: 30px; font-weight: 700; line-height: 1.1; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.big small { font-family: var(--body); font-size: 14px; font-weight: 500; color: var(--muted); }
.rows { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.rows li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; font-size: 15px; }
.rows li > span:first-child { color: var(--muted); }
.next { border-left: 3px solid var(--spot); padding: 2px 0 2px 10px; font-size: 15px; }
.spark { width: 100%; height: 64px; display: block; }
.spark-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* 가격 지도 */
.mapcard { background: linear-gradient(180deg, #172440 0%, var(--bg2) 100%); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px 12px 0; overflow-x: auto; }
.maphead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 0 8px 16px; flex-wrap: wrap; }
.maphead h2 { font-size: 20px; font-weight: 600; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.ladder { position: relative; min-width: 340px; }
.lanes { position: absolute; inset: 0 0 0 60px; display: grid; }
.lane { position: relative; border-left: 1px dashed var(--line); }
.lane-head { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.tick { position: absolute; left: 0; width: 54px; text-align: right; transform: translateY(-50%); font-size: 12px; color: var(--muted); }
.gl { position: absolute; left: 60px; right: 0; height: 1px; background: var(--line); opacity: .5; }
.band { position: absolute; left: 6px; right: 6px; border-radius: 9px; padding: 6px 8px; font-size: 12.5px; line-height: 1.35; display: flex; flex-direction: column; justify-content: center; gap: 2px; overflow: hidden; }
.band strong { font-family: var(--display); font-size: 14px; }
.band span { color: var(--text); opacity: .86; }
.band.take { background: linear-gradient(180deg, color-mix(in srgb, var(--take) 26%, transparent), color-mix(in srgb, var(--take) 8%, transparent)); border: 1px solid color-mix(in srgb, var(--take) 55%, transparent); color: var(--take); }
.band.spot { background: linear-gradient(180deg, color-mix(in srgb, var(--spot) 24%, transparent), color-mix(in srgb, var(--spot) 7%, transparent)); border: 1px solid color-mix(in srgb, var(--spot) 55%, transparent); color: var(--spot); }
.band.fut  { background: linear-gradient(180deg, color-mix(in srgb, var(--fut) 28%, transparent), color-mix(in srgb, var(--fut) 10%, transparent)); border: 1px solid color-mix(in srgb, var(--fut) 60%, transparent); color: var(--fut); }
.band.live { box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 40%, transparent), 0 0 18px color-mix(in srgb, currentColor 35%, transparent); }
.lvl { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid currentColor; }
.lvl.dash { border-top-style: dashed; }
.lvl.ref { border-top: 1px dotted currentColor; }
.lvl.gone { opacity: .5; }
.lvl .lab { position: absolute; left: 6px; right: 6px; bottom: 3px; font-size: 12.5px; line-height: 1.3; }
.lvl.below .lab { bottom: auto; top: 3px; }
.lvl .lab strong { font-family: var(--display); font-size: 14px; font-variant-numeric: tabular-nums; }
.lvl .lab span { color: var(--text); opacity: .86; }
.lvl .lab em { font-style: normal; font-family: var(--display); font-size: 12px; color: var(--muted); margin-left: 4px; }
.lvl.gone .lab strong { text-decoration: line-through; }
.lvl.full { left: 60px; }
.now { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid #fff; box-shadow: 0 0 10px 1px rgba(255,255,255,.55); z-index: 3; pointer-events: none; }
.now .pill { position: absolute; right: 4px; top: 0; transform: translateY(-50%); background: #fff; color: #0b111e; font-family: var(--display); font-weight: 700; font-size: 12.5px; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.now .pill small { font-weight: 600; font-size: 10.5px; color: #3a4560; margin-left: 3px; }
.mapnote { padding: 10px 0 0 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.chip { font-family: var(--display); font-size: 13px; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--spot) 12%, transparent); color: var(--spot); border: 1px solid color-mix(in srgb, var(--spot) 40%, transparent); }

/* 레벨 표 */
.lvtable { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.lvtable th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
.lvtable td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.lvtable td.p { font-family: var(--display); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.lvtable td.d { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; white-space: nowrap; }
.lvtable tr.nowrow td { background: rgba(255,255,255,.06); font-weight: 600; }
.st { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; margin-left: 6px; white-space: nowrap; }
.table-box { overflow-x: auto; }

/* 원칙·기록 */
section > h2 { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
.rules { display: grid; gap: 10px; }
.rule { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--spot); border-radius: 14px; padding: 14px 18px; }
.rule q { quotes: none; font-size: 18px; font-weight: 600; }
.rule p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
.log li:first-child { border-top: 0; }
.log time { color: var(--muted); font-family: var(--display); font-variant-numeric: tabular-nums; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 14px 18px; color: var(--muted); font-size: 14.5px; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 4px; }

@media (max-width: 420px) {
  .rows li { grid-template-columns: 82px 1fr; }
  .log li { grid-template-columns: 1fr; gap: 2px; }
  .band, .lvl .lab { font-size: 11.5px; }
  .band { padding: 5px 6px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (a, p) => a.unit === "" ? (p >= 1000 ? (Math.round(p / 100) / 10).toString().replace(/\.0$/, "") + "k" : String(p)) : a.unit + (p >= 100 ? p.toFixed(2).replace(/\.00$/, "") : p.toFixed(2).replace(/0$/, "").replace(/\.0$/, ""));
const pct = (from, to) => { const v = (to / from - 1) * 100; return (v > 0 ? "+" : "−") + Math.abs(v).toFixed(1) + "%"; };

$("upd").textContent = UPDATED;

/* 탭 */
function tabs(active) {
  $("tabs").innerHTML = ASSETS.map(a => `<button class="tab" role="tab" id="tab-${a.id}" aria-selected="${a.id === active}" data-id="${a.id}">${esc(a.name)}<span class="px">${fmt(a, a.now.p)}</span></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.id; }));
}

function spark(key, cap) {
  const s = SERIES[key]; if (!s || s.length < 2) return "";
  const W = 600, H = 64, ys = s.map(x => x[1]), mn = Math.min(...ys), mx = Math.max(...ys);
  const X = i => i / (s.length - 1) * W, Y = v => H - 4 - (v - mn) / (mx - mn || 1) * (H - 8);
  const d = s.map((x, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(x[1]).toFixed(1)).join(" ");
  const up = ys.at(-1) >= ys[0], col = up ? "var(--take)" : "var(--short)";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="g-${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${W} ${H} L0 ${H} Z" fill="url(#g-${key})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(s.length - 1)}" cy="${Y(ys.at(-1))}" r="3.5" fill="${col}"/></svg>
    <div class="spark-cap"><span>${esc(cap)}</span><span class="num">저 ${mn.toLocaleString()} / 고 ${mx.toLocaleString()}</span></div>`;
}

function render(id) {
  const a = ASSETS.find(x => x.id === id) || ASSETS[0];
  tabs(a.id);
  const S = a.summary;
  const H = Math.max(560, Math.min(780, window.innerHeight * 0.95)), PAD = 30;
  const tf = a.scale === "log" ? Math.log : (v => v);
  const y = p => PAD + (tf(a.hi) - tf(p)) / (tf(a.hi) - tf(a.lo)) * (H - PAD * 2);
  const nLanes = a.lanes.length;

  /* 지금 할 일 카드 */
  let html = `<div class="grid2">
    <div class="card">
      <h3>${esc(S.title)} <span class="tag c-${S.tag[1]}">${esc(S.tag[0])}</span></h3>
      <div class="big num">${esc(S.big)}${S.bigNote ? `<small>${esc(S.bigNote)}</small>` : ""}</div>
      <ul class="rows">${S.rows.map(r => `<li><span>${esc(r[0])}</span><span>${esc(r[1])}</span></li>`).join("")}</ul>
      <div class="next">다음: ${esc(S.next)}</div>
    </div>
    <div class="card">
      <h3>현재가 ${a.isLive ? `<span class="tag c-take"><span class="dot"></span>실시간</span><span class="muted" style="font-weight:500">OKX 무기한 시세</span>` : `<span class="muted" style="font-weight:500">${esc(a.now.at)} 기준${a.live ? ", 실시간 연결 중" : ""}</span>`}</h3>
      <div class="big num">${fmt(a, a.now.p)}</div>
      ${a.spark ? spark(a.spark.key, a.spark.cap) : `<div class="muted" style="font-size:14px">${esc(a.note || "")}</div>`}
    </div>
  </div>`;

  /* 가격 지도 */
  const ticks = niceTicks(a);
  let lad = `<div class="ladder" style="height:${H}px">`;
  ticks.forEach(t => { lad += `<div class="gl" style="top:${y(t)}px"></div><div class="tick num" style="top:${y(t)}px">${fmt(a, t)}</div>`; });
  lad += `<div class="lanes" style="grid-template-columns:repeat(${nLanes},1fr)">`;
  a.lanes.forEach((ln, i) => {
    lad += `<div class="lane"><div class="lane-head">${esc(ln)}</div>`;
    a.items.filter(it => it.lane === i + 1).forEach(it => { lad += it.kind === "band" ? band(a, it, y) : level(a, it, y); });
    lad += `</div>`;
  });
  lad += `</div>`;
  a.items.filter(it => it.lane === 0).forEach(it => { lad += level(a, it, y, true); });
  lad += `<div class="now" style="top:${y(a.now.p)}px"><span class="pill">${fmt(a, a.now.p)}<small>현재</small></span></div>`;
  lad += `</div>`;

  html += `<div class="mapcard">
    <div class="maphead"><h2>${esc(a.name)} 가격 지도</h2>
      <div class="legend">${legend(a)}</div></div>
    ${lad}
    ${a.chips ? `<div class="mapnote">${esc(a.chips.label)} ${a.chips.list.map(p => `<span class="chip">${fmt(a, p)} <span style="opacity:.7">${pct(a.now.p, p)}</span></span>`).join("")}</div>` : ""}
    ${a.note && a.spark ? `<div class="mapnote">${esc(a.note)}</div>` : ""}
  </div>`;

  /* 레벨 표 */
  const rows = a.items.map(it => ({ p: it.kind === "band" ? it.top : it.p, p2: it.kind === "band" ? it.bot : null, it }));
  rows.push({ p: a.now.p, now: true });
  rows.sort((m, n) => n.p - m.p);
  html += `<div class="card"><h3>가격별 정리 (위에서 아래로)</h3><div class="table-box"><table class="lvtable">
    <thead><tr><th>가격</th><th>내용</th><th style="text-align:right">거리</th></tr></thead><tbody>
    ${rows.map(r => r.now
      ? `<tr class="nowrow"><td class="p">${fmt(a, r.p)}</td><td>현재가 (${a.isLive ? "실시간" : esc(a.now.at)})</td><td class="d">0%</td></tr>`
      : `<tr><td class="p c-${r.it.c}">${fmt(a, r.p)}${r.p2 ? "~" + fmt(a, r.p2) : ""}</td><td>${esc(r.it.label)}${r.it.note ? ` <span class="muted">${esc(r.it.note)}</span>` : ""}${r.it.st ? `<span class="st c-${r.it.st[1]}">${esc(r.it.st[0])}</span>` : ""}</td><td class="d">${r.it.noDist ? "" : pct(a.now.p, r.p)}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  if (a.empty) html += `<div class="empty">${esc(a.empty)}</div>`;
  $("view").innerHTML = html;
}

function band(a, it, y) {
  const h0 = y(it.bot) - y(it.top), hh = Math.max(58, h0), top = y(it.top) - (hh - h0) / 2;
  const live = a.now.p <= it.top && a.now.p >= it.bot;
  return `<div class="band ${it.c}${live ? " live" : ""}" style="top:${top}px;height:${hh}px"><strong>${esc(it.label)}</strong><span>${esc(it.note)}</span><em class="num" style="font-style:normal;font-size:12px;opacity:.8">${live ? "지금 이 구간" : pct(a.now.p, it.top) + " 부터"}</em></div>`;
}
function level(a, it, y, full) {
  const cls = ["lvl", "c-" + it.c, it.dash ? "dash" : "", it.ref ? "ref" : "", it.gone ? "gone" : "", it.below ? "below" : "", full ? "full" : ""].join(" ");
  return `<div class="${cls}" style="top:${y(it.p)}px"><div class="lab"><strong>${fmt(a, it.p)}</strong> ${esc(it.label)}${it.noDist ? "" : `<em>${pct(a.now.p, it.p)}</em>`}${it.note ? `<br><span>${esc(it.note)}</span>` : ""}</div></div>`;
}
function legend(a) {
  const m = { short: "숏", take: "익절·매수", spot: "현물", fut: "선물", bottom: "바닥 예상", ref: "참고" };
  return [...new Set(a.items.map(i => i.c))].map(c => `<span><i style="background:var(--${c})"></i>${m[c]}</span>`).join("");
}
function niceTicks(a) {
  if (a.unit === "") return [100000, 90000, 80000, 70000, 60000, 50000, 40000, 30000, 25000, 21000].filter(t => t >= a.lo && t <= a.hi);
  const span = a.hi - a.lo, step = span > 50 ? 10 : 5, out = [];
  for (let t = Math.ceil(a.lo / step) * step; t <= a.hi; t += step) out.push(t);
  return out;
}

$("notes").innerHTML = `<h3>${esc(NOTES.title)} <span class="muted" style="font-weight:500">${esc(NOTES.at)}</span></h3>
  <ul class="rows">${NOTES.items.map(n => `<li><span>${esc(n.k)}</span><span>${esc(n.v)}</span></li>`).join("")}</ul>
  <div class="next">${esc(NOTES.foot)}</div>`;
$("rules").innerHTML = RULES.map(r => `<div class="rule"><q>${esc(r.q)}</q><p>${esc(r.p)}</p></div>`).join("");
$("log").innerHTML = LOG.map(l => `<li><time>${esc(l.t)}</time><span>${esc(l.m)}</span></li>`).join("");

let current = (location.hash || "#btc").slice(1);
const route = () => { current = (location.hash || "#btc").slice(1); render(current); };
window.addEventListener("hashchange", route);
route();

/* 실시간 시세: OKX 공개 웹소켓 (로그인·키 없음). 끊기면 다시 연결, 안 되면 기준 시각 가격 유지 */
(function live() {
  const subs = ASSETS.filter(a => a.live);
  if (!subs.length || !("WebSocket" in window)) return;
  let ws, ping, wait = 2000, dirty = false;
  const open = () => {
    try { ws = new WebSocket("wss://ws.okx.com:8443/ws/v5/public"); } catch (e) { return; }
    ws.onopen = () => {
      wait = 2000;
      ws.send(JSON.stringify({ op: "subscribe", args: subs.map(a => ({ channel: "tickers", instId: a.live })) }));
      clearInterval(ping); ping = setInterval(() => { try { ws.send("ping"); } catch (e) {} }, 25000);
    };
    ws.onmessage = ev => {
      if (ev.data === "pong") return;
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!m.data || !m.arg) return;
      const a = subs.find(x => x.live === m.arg.instId), px = parseFloat(m.data[0] && m.data[0].last);
      if (!a || !(px > 0)) return;
      a.now.p = px; a.isLive = true; dirty = true;
    };
    ws.onclose = () => { clearInterval(ping); subs.forEach(a => a.isLive = false); dirty = true; setTimeout(open, wait); wait = Math.min(wait * 2, 60000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  };
  open();
  setInterval(() => { if (dirty && !document.hidden) { dirty = false; render(current); } }, 2000);
})();
